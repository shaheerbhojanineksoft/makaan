<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Illustrated skyline of Pakistani landmarks — Badshahi Mosque, Minar-e-Pakistan, Mazar-e-Quaid and Faisal Mosque beneath a crescent moon and star">
  <title>Pakistani landmark skyline</title>

  <defs>
    <linearGradient id="ppSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#01110a"/>
      <stop offset="0.34" stop-color="#013c19"/>
      <stop offset="0.60" stop-color="#02702c"/>
      <stop offset="0.76" stop-color="#03822f"/>
      <stop offset="0.88" stop-color="#02561f"/>
      <stop offset="1" stop-color="#013a16"/>
    </linearGradient>

    <radialGradient id="ppGlow" cx="0.5" cy="0.84" r="0.62">
      <stop offset="0" stop-color="#a7f3c8" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#6ee7a0" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#6ee7a0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ppGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#010d06"/>
      <stop offset="1" stop-color="#010503"/>
    </linearGradient>

    <pattern id="ppGeo" width="120" height="120" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#a7f3c8" stroke-width="1.1">
        <path d="M60 18 L78 42 L102 60 L78 78 L60 102 L42 78 L18 60 L42 42 Z"/>
        <rect x="36" y="36" width="48" height="48" transform="rotate(45 60 60)"/>
      </g>
    </pattern>
  </defs>

  <!-- Sky with a dusk glow rising off the horizon -->
  <rect width="1600" height="900" fill="url(#ppSky)"/>
  <rect width="1600" height="800" fill="url(#ppGeo)" opacity="0.06"/>
  <ellipse cx="800" cy="756" rx="880" ry="250" fill="url(#ppGlow)"/>

  <!-- Stars -->
  <g fill="#eafff2">
    <circle cx="90" cy="120" r="2" opacity="0.55"/>
    <circle cx="180" cy="60" r="1.6" opacity="0.45"/>
    <circle cx="280" cy="160" r="1.8" opacity="0.5"/>
    <circle cx="60" cy="260" r="1.4" opacity="0.4"/>
    <circle cx="150" cy="330" r="2" opacity="0.55"/>
    <circle cx="360" cy="80" r="1.6" opacity="0.45"/>
    <circle cx="470" cy="140" r="1.4" opacity="0.4"/>
    <circle cx="560" cy="60" r="2" opacity="0.5"/>
    <circle cx="700" cy="92" r="1.4" opacity="0.35"/>
    <circle cx="880" cy="70" r="1.6" opacity="0.4"/>
    <circle cx="1000" cy="70" r="1.6" opacity="0.45"/>
    <circle cx="1090" cy="140" r="1.8" opacity="0.5"/>
    <circle cx="1150" cy="60" r="1.4" opacity="0.4"/>
    <circle cx="1240" cy="240" r="1.6" opacity="0.45"/>
    <circle cx="1330" cy="90" r="2" opacity="0.55"/>
    <circle cx="1420" cy="300" r="1.4" opacity="0.4"/>
    <circle cx="1520" cy="140" r="2" opacity="0.5"/>
    <circle cx="1560" cy="260" r="1.6" opacity="0.45"/>
    <circle cx="240" cy="420" r="1.4" opacity="0.35"/>
    <circle cx="1360" cy="420" r="1.6" opacity="0.35"/>
    <circle cx="60" cy="520" r="1.4" opacity="0.3"/>
    <circle cx="1540" cy="500" r="1.4" opacity="0.3"/>
  </g>

  <!-- Crescent + star -->
  <g>
    <circle cx="1310" cy="140" r="52" fill="#f4fff8"/>
    <circle cx="1332" cy="126" r="44" fill="#01411C"/>
    <polygon
      points="1452,190 1457,203.1 1471,203.8 1460.1,212.6 1463.8,226.2 1452,218.5 1440.2,226.2 1443.9,212.6 1433,203.8 1447,203.1"
      fill="#f4fff8"/>
  </g>

  <!-- Distant skyline (mid-tone: reads as depth behind the landmarks) -->
  <g fill="#015223">
    <rect x="0" y="716" width="46" height="64"/>
    <rect x="46" y="690" width="34" height="90"/>
    <rect x="80" y="736" width="58" height="44"/>
    <rect x="138" y="668" width="30" height="112"/>
    <rect x="168" y="706" width="54" height="74"/>
    <rect x="222" y="730" width="40" height="50"/>
    <rect x="404" y="700" width="44" height="80"/>
    <rect x="448" y="728" width="52" height="52"/>
    <rect x="660" y="712" width="40" height="68"/>
    <rect x="700" y="684" width="46" height="96"/>
    <rect x="746" y="724" width="54" height="56"/>
    <rect x="990" y="716" width="50" height="64"/>
    <rect x="1020" y="690" width="38" height="90"/>
    <rect x="1450" y="708" width="44" height="72"/>
    <rect x="1494" y="686" width="40" height="94"/>
    <rect x="1534" y="722" width="66" height="58"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="780" width="1600" height="120" fill="url(#ppGround)"/>
  <rect x="0" y="780" width="1600" height="2" fill="#a7f3c8" opacity="0.22"/>

  <!-- Badshahi Mosque, Lahore -->
  <g fill="#010d06">
    <rect x="168" y="700" width="174" height="80"/>
    <path d="M178 700 C178 664 190 656 205 636 C220 656 232 664 232 700 Z"/>
    <path d="M228 700 C228 662 240 654 255 632 C270 654 282 662 282 700 Z"/>
    <path d="M278 700 C278 664 290 656 305 636 C320 656 332 664 332 700 Z"/>
    <rect x="203" y="620" width="4" height="18"/>
    <rect x="253" y="616" width="4" height="18"/>
    <rect x="303" y="620" width="4" height="18"/>
    <circle cx="205" cy="617" r="4"/>
    <circle cx="255" cy="613" r="4"/>
    <circle cx="305" cy="617" r="4"/>
    <rect x="146" y="636" width="16" height="144"/>
    <rect x="348" y="636" width="16" height="144"/>
    <path d="M146 636 C146 620 162 620 162 636 Z"/>
    <path d="M348 636 C348 620 364 620 364 636 Z"/>
    <rect x="152" y="614" width="4" height="8"/>
    <rect x="354" y="614" width="4" height="8"/>
    <circle cx="154" cy="610" r="4"/>
    <circle cx="356" cy="610" r="4"/>
  </g>

  <!-- Minar-e-Pakistan, Lahore (tallest, front-most silhouette) -->
  <g fill="#010b05">
    <rect x="470" y="772" width="180" height="18" rx="4"/>
    <path d="M478 772 C496 726 520 700 528 664 L534 500 L586 500 L592 664 C600 700 624 726 642 772 Z"/>
    <rect x="524" y="492" width="72" height="12" rx="6"/>
    <path d="M534 494 L586 494 L578 448 L542 448 Z"/>
    <rect x="534" y="436" width="52" height="14" rx="5"/>
    <path d="M542 436 C542 418 578 418 578 436 Z"/>
    <rect x="558" y="402" width="4" height="16"/>
    <circle cx="560" cy="398" r="5"/>
  </g>

  <!-- Mazar-e-Quaid, Karachi -->
  <g fill="#010d06">
    <rect x="766" y="748" width="228" height="34" rx="4"/>
    <rect x="790" y="730" width="180" height="20"/>
    <rect x="796" y="612" width="16" height="118"/>
    <rect x="948" y="612" width="16" height="118"/>
    <path d="M796 612 C796 596 812 596 812 612 Z"/>
    <path d="M948 612 C948 596 964 596 964 612 Z"/>
    <rect x="828" y="628" width="104" height="102"/>
    <path d="M828 628 C820 578 856 556 880 548 C904 556 940 578 932 628 Z"/>
    <rect x="877" y="512" width="6" height="30"/>
    <circle cx="880" cy="508" r="6"/>
  </g>

  <!-- Faisal Mosque, Islamabad -->
  <g fill="#011007">
    <rect x="1024" y="774" width="412" height="22" rx="3"/>
    <path d="M1054 780 L1118 656 L1182 780 Z"/>
    <path d="M1278 780 L1342 656 L1406 780 Z"/>
    <path d="M1128 780 L1230 588 L1332 780 Z"/>
    <rect x="1032" y="552" width="18" height="228"/>
    <rect x="1404" y="552" width="18" height="228"/>
    <rect x="1102" y="596" width="14" height="184"/>
    <rect x="1338" y="596" width="14" height="184"/>
    <path d="M1032 552 L1050 552 L1041 526 Z"/>
    <path d="M1404 552 L1422 552 L1413 526 Z"/>
    <path d="M1102 596 L1116 596 L1109 576 Z"/>
    <path d="M1338 596 L1352 596 L1345 576 Z"/>
    <circle cx="1041" cy="520" r="4"/>
    <circle cx="1413" cy="520" r="4"/>
    <circle cx="1109" cy="571" r="3"/>
    <circle cx="1345" cy="571" r="3"/>
  </g>
</svg>
